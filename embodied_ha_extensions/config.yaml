name: Embodied HA Extensions (development)
version: "0.1.0-dev.2"
slug: embodied_ha_extensions
description: "Development build for curated, opt-in first-party Embodied HA extensions."
advanced: true
stage: experimental
arch:
  - amd64
  - aarch64
init: true
startup: application
boot: manual
hassio_api: true
services:
  - mqtt:need
map:
  - config:rw
options:
  log_level: info
  enabled_extensions: []
  ambient_speech_context:
    retention_hours: 24
    max_lines: 3
schema:
  log_level: list(debug|info|warning|error)
  enabled_extensions:
    - str
  ambient_speech_context:
    retention_hours: int(1,168)
    max_lines: int(1,20)
